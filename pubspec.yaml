name: flutterdraw
description: A cross-platform hand-drawn whiteboard built with Flutter.
publish_to: "none"
version: 0.3.5+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  file_picker: ^10.3.7
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  launcher_icons: ^0.16.0

flutter:
  uses-material-design: true

launcher_icons:
  image_path: "docs/img/logo.png"
  android:
    generate: true
  ios:
    generate: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#082B63"
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
